
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulário de Patrimônio</title>
</head>

<body>

<h2>Cadastro / Edição de Patrimônio</h2>

<form th:action="@{/patrimonios/salvar}"
      th:object="${patrimonio}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <label>Nr Patrimônio</label>
    <input type="text"
           th:field="*{nr_patrimonio}"
           required>

    <br><br>

    <label>Descrição</label>
    <input type="text"
           th:field="*{descricao}"
           required>

    <br><br>

    <label>Local</label>
    <input type="text"
           th:field="*{local}"
           required>

    <br><br>

    <button type="submit">Salvar</button>

    <a th:href="@{/patrimonios}">Cancelar</a>

</form>

</body>
</html>
